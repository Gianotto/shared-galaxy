# =============================================================
# /etc/nginx/conf.d/sgalaxy_limits.conf
# Zonas de rate limit da Galáxia Compartilhada.
#
# Ficam aqui, e não no nginx.conf, para o projeto ser removível sem editar a
# configuração global. O conf.d/ é incluído dentro do http{} antes dos sites.
# =============================================================

# Tráfego geral: navegar, listar salas, consultar estado.
limit_req_zone $binary_remote_addr zone=sgalaxy_general:10m rate=300r/m;

# Criar conta. É grátis e sem e-mail, então é aqui que o abuso de sala aberta
# apareceria primeiro.
#
# `1r/m` é o piso do nginx: a diretiva só entende `r/s` e `r/m`, e o valor tem
# que ser inteiro. Na prática isso permite 60 contas por hora por IP, mais
# folgado do que se gostaria. O que compensa é o que vem depois da conta — cota
# de 5 salas por conta, limite de upload, e a variável SGALAXY_INVITE_ONLY, que
# fecha o cadastro por completo se o abuso aparecer.
limit_req_zone $binary_remote_addr zone=sgalaxy_signup:10m  rate=1r/m;

# Subir e baixar savegame. Operação pesada, e ninguém legítimo faz em rajada.
limit_req_zone $binary_remote_addr zone=sgalaxy_save:10m    rate=20r/m;

limit_conn_zone $binary_remote_addr zone=sgalaxy_conn:10m;
