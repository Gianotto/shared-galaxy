# =============================================================
# /etc/nginx/sites-available/galaxy.bygianotto.com.br
#
# Galáxia Compartilhada — servidor de custódia de savegames.
# Cloudflare Tunnel → nginx :80 → container em 127.0.0.1:8714.
#
# Sem TLS aqui de propósito: o túnel termina TLS no Cloudflare e a origem é
# loopback, seguindo o mesmo padrão de essentia/automate/demo neste servidor.
#
# Aplique com:
#   sudo ln -s /etc/nginx/sites-available/galaxy.bygianotto.com.br \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================

server {
    listen 80;
    listen [::]:80;
    server_name galaxy.bygianotto.com.br;

    # Um savegame de partida grande passa de 10 MB; o servidor recusa acima de
    # 64 MB e responde 413 com explicação. Aqui fica um pouco acima, para a
    # recusa vir do aplicativo com mensagem, e não do nginx com página seca.
    client_max_body_size 70m;

    # Conexões simultâneas por IP. Upload e download de save são demorados, e
    # um punhado de conexões por pessoa é o suficiente.
    limit_conn sgalaxy_conn 10;

    # Tráfego geral.
    limit_req zone=sgalaxy_general burst=30 nodelay;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ----- Criar conta: o vetor de abuso de uma sala aberta -----
    # Token é grátis e sem e-mail, então o freio tem que estar aqui. 3 por hora
    # por IP é folgado para gente e apertado para script.
    location = /api/v1/players {
        limit_req zone=sgalaxy_signup burst=3 nodelay;
        proxy_pass http://127.0.0.1:8714;
        include /etc/nginx/proxy_sgalaxy.conf;
    }

    # ----- Upload e download de save: lentos por natureza -----
    location ~ ^/api/v1/rooms/[^/]+/(join|checkin|checkout)$ {
        limit_req zone=sgalaxy_save burst=5 nodelay;
        proxy_pass http://127.0.0.1:8714;
        include /etc/nginx/proxy_sgalaxy.conf;
        proxy_request_buffering off;   # não acumula 64 MB em disco antes de repassar
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8714;
        include /etc/nginx/proxy_sgalaxy.conf;
    }
}
