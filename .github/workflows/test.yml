name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 é o piso declarado no README; 3.13 pega o que quebrou desde então.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Testes
        run: python3 -m unittest discover -s tests -t . -v

      - name: As ferramentas rodam
        # Sem save real no CI, o que dá para garantir é que os scripts importam
        # e respondem ao --help. Já pega erro de sintaxe e import quebrado.
        run: |
          for tool in tools/*.py; do
            echo "== $tool"
            python3 "$tool" --help > /dev/null
          done

      - name: Ferramentas sem dependências externas
        # A promessa vale para `tools/` e `sgalaxy/`: quem só quer analisar um
        # save não instala nada. O servidor em `server/` tem dependências de
        # propósito e fica fora desta checagem.
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys
          allowed = {"sgalaxy", "tools", "tests"}
          bad = []
          for folder in ("tools", "sgalaxy"):
            for path in pathlib.Path(folder).rglob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [(node.module or "").split(".")[0]]
                  else:
                      continue
                  for name in names:
                      if not name or name in allowed:
                          continue
                      if name in sys.stdlib_module_names:
                          continue
                      bad.append(f"{path}: {name}")
          if bad:
              print("dependência fora da biblioteca padrão:")
              print("\n".join(bad))
              raise SystemExit(1)
          print("só biblioteca padrão, como prometido")
          PY

  api:
    # O servidor é testado contra um Postgres de verdade, nunca contra dublê. A
    # garantia que mais importa nesta fase — um empréstimo aberto por jogador —
    # é um índice único do banco, e um dublê não testaria isso.
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sgalaxy
          POSTGRES_USER: sgalaxy
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependências
        run: pip install -r requirements.txt httpx

      - name: Migração
        run: psql "$DATABASE_URL" -f migrations/001_initial.sql
        env:
          DATABASE_URL: postgresql://sgalaxy:test@localhost:5432/sgalaxy

      - name: Testes da API
        run: python -m unittest tests.test_api -v
        env:
          DATABASE_URL: postgresql://sgalaxy:test@localhost:5432/sgalaxy
          BLOB_ROOT: /tmp/sgalaxy-blobs

      - name: A imagem constrói
        run: docker build -t sgalaxy .
